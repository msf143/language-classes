<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hablemos · Teacher</title>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="common.js" defer></script>
  <script src="teacher.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">Hablemos</a>
      <div class="header-actions">
        <a class="link" href="/" data-i18n="backToClasses"></a>
        <div class="lang-switch" role="group" aria-label="Interface language">
          <button type="button" data-ui-lang="en">EN</button>
          <button type="button" data-ui-lang="es">ES</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1 data-i18n="teacherTitle"></h1>
    <p class="tz-note" id="tz-note"></p>

    <!-- Loading / not signed in / not a teacher / error -->
    <div id="status" class="status" aria-live="polite" hidden></div>

    <div id="dashboard" hidden>
      <!-- Shown while an admin hasn't activated this teacher yet. -->
      <div id="pending-note" class="notice" role="status" hidden><span data-i18n="pendingNote"></span></div>
      <!-- Profile: the form owns its inputs; teacher.js fills them when the
           profile loads (and after a save), never on an ordinary re-render. -->
      <section class="teacher-section">
        <h2 data-i18n="myProfile"></h2>
        <p class="muted" data-i18n="profileHint"></p>
        <form id="profile-form" class="add-block profile-form" novalidate>
          <label class="field"><span data-i18n="profileName"></span>
            <input type="text" name="display_name" maxlength="60" required></label>
          <label class="field"><span data-i18n="profileBioEN"></span>
            <textarea name="bio_en" rows="4" maxlength="2000"></textarea></label>
          <label class="field"><span data-i18n="profileBioES"></span>
            <textarea name="bio_es" rows="4" maxlength="2000"></textarea></label>
          <div class="add-block-fields">
            <label class="field"><span data-i18n="profileBreak"></span>
              <select name="break_minutes" id="profile-break"></select></label>
            <fieldset class="field profile-lengths">
              <legend data-i18n="profileLengths"></legend>
              <div id="profile-lengths"></div>
            </fieldset>
          </div>
          <p class="muted small" data-i18n="profileLengthsHint"></p>
          <p id="profile-error" class="form-error" aria-live="polite"></p>
          <button type="submit" class="btn-primary" id="profile-submit"></button>
        </form>
      </section>

      <!-- Prices: a table of inputs in dollars, built by teacher.js from the
           server's lengths and party size; empty = no price (can't be booked). -->
      <section class="teacher-section">
        <h2 data-i18n="myPrices"></h2>
        <p class="muted" data-i18n="pricesHint"></p>
        <form id="prices-form" class="add-block" novalidate>
          <div class="price-table-wrap">
            <table class="price-table">
              <thead><tr id="prices-head"></tr></thead>
              <tbody id="prices-body"></tbody>
            </table>
          </div>
          <p class="muted small" data-i18n="pricesNote"></p>
          <p id="prices-error" class="form-error" aria-live="polite"></p>
          <button type="submit" class="btn-primary" id="prices-submit"></button>
        </form>
      </section>

      <section class="teacher-section">
        <h2 data-i18n="myAvailability"></h2>
        <p class="muted" data-i18n="availabilityHint"></p>
        <ul id="block-list" class="block-list"></ul>

        <!-- Times are typed in the teacher's own time zone; the server converts them. -->
        <form id="add-block" class="add-block" novalidate>
          <h3 data-i18n="addTimes"></h3>
          <div class="add-block-fields">
            <label class="field"><span data-i18n="dateLabel"></span>
              <input type="date" name="date" id="add-date" required></label>
            <label class="field"><span data-i18n="fromLabel"></span>
              <input type="time" name="from" step="900" required></label>
            <label class="field"><span data-i18n="toLabel"></span>
              <input type="time" name="to" step="900" required></label>
            <label class="field"><span data-i18n="repeatLabel"></span>
              <select name="repeat_weeks" id="add-repeat"></select></label>
          </div>
          <p id="add-error" class="form-error" aria-live="polite"></p>
          <button type="submit" class="btn-primary" id="add-submit"></button>
        </form>
      </section>

      <section class="teacher-section">
        <h2 data-i18n="myClasses"></h2>
        <ul id="class-list" class="block-list"></ul>

        <!-- A new group class: date and time in the teacher's own zone (the server converts). -->
        <form id="new-class" class="add-block" novalidate>
          <h3 data-i18n="newClass"></h3>
          <label class="field"><span data-i18n="classTitle"></span>
            <input type="text" name="title" maxlength="100" required></label>
          <div class="add-block-fields">
            <label class="field"><span data-i18n="filterLanguage"></span>
              <select name="target_language" id="new-class-language"></select></label>
            <label class="field"><span data-i18n="filterAudience"></span>
              <select name="audience" id="new-class-audience"></select></label>
          </div>
          <div class="add-block-fields">
            <label class="field"><span data-i18n="dateLabel"></span>
              <input type="date" name="date" id="new-class-date" required></label>
            <label class="field"><span data-i18n="fromLabel"></span>
              <input type="time" name="from" step="900" required></label>
            <label class="field"><span data-i18n="lengthLabel"></span>
              <select name="duration_minutes" id="new-class-length"></select></label>
            <label class="field"><span data-i18n="minSeats"></span>
              <input type="number" name="min_seats" min="2" max="30" value="2" required></label>
            <label class="field"><span data-i18n="maxSeats"></span>
              <input type="number" name="max_seats" min="2" max="30" placeholder="—"></label>
          </div>
          <p class="muted small" data-i18n="newClassHint"></p>
          <p id="new-class-error" class="form-error" aria-live="polite"></p>
          <button type="submit" class="btn-primary" id="new-class-submit"></button>
        </form>
      </section>
    </div>
  </main>

  <!-- Confirm cancelling one of his classes (teacher.js fills it in). -->
  <dialog id="cancel-class-dialog" class="dialog" aria-labelledby="cancel-class-title">
    <form id="cancel-class-form" novalidate>
      <h2 id="cancel-class-title" data-i18n="cancelClassTitle"></h2>
      <p id="cancel-class-what"></p>
      <p id="cancel-class-effect" class="book-price"></p>
      <p id="cancel-class-error" class="form-error" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-action="close-cancel-class" data-i18n="keepClass"></button>
        <button type="submit" class="btn-danger" id="cancel-class-submit"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
