<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Classes</title>
  <link rel="stylesheet" href="styles.css">
  <!-- defer: run the scripts after the HTML is parsed, so the DOM exists -->
  <script src="i18n.js" defer></script>
  <script src="common.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Test sites only (staging, dev): says money here is fake and offers free
       test credit. Hidden on production (app.js asks GET /env). -->
  <div id="test-banner" class="test-banner" hidden>
    <div class="wrap test-banner-row">
      <span data-i18n="testBanner"></span>
      <button type="button" class="btn-secondary btn-small" id="test-credit-btn" data-action="test-credit"></button>
      <button type="button" class="btn-secondary btn-small" id="test-teacher-btn" data-action="test-teacher"></button>
    </div>
  </div>

  <header class="site-header">
    <div class="wrap header-row">
      <span class="brand">Hablemos</span>
      <div class="header-actions">
        <!-- Sign-in button, or the signed-in name, credit, Buy credit + Sign out (built in app.js) -->
        <div id="account-area" class="account-area"></div>
        <!-- Language switch for the interface itself -->
        <div class="lang-switch" role="group" aria-label="Interface language">
          <button type="button" data-ui-lang="en">EN</button>
          <button type="button" data-ui-lang="es">ES</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- After coming back from Stripe (/?paid=...): is the credit in yet? (app.js) -->
    <div id="paid-notice" class="notice" role="status" hidden>
      <span id="paid-text"></span>
      <button type="button" class="btn-secondary btn-small" data-action="dismiss-paid" data-i18n="close"></button>
    </div>
    <section class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroSubtitle"></p>
    </section>

    <!-- Your upcoming bookings (built in app.js from GET /bookings); hidden when
         signed out or when there are none. -->
    <section class="my-bookings" id="my-bookings" hidden>
      <h2 data-i18n="myBookings"></h2>
      <ul id="my-bookings-list" class="my-bookings-list"></ul>
    </section>

    <section class="catalog">
      <div class="catalog-head">
        <h2 data-i18n="upcoming"></h2>
        <p class="tz-note" id="tz-note"></p>
      </div>

      <!-- Filters: each group sets one key in state.filters -->
      <div class="filters">
        <div class="filter">
          <span class="filter-label" data-i18n="filterLanguage"></span>
          <div class="segmented" data-filter="language">
            <button type="button" data-value="" data-i18n="all"></button>
            <button type="button" data-value="es" data-i18n="learnSpanish"></button>
            <button type="button" data-value="en" data-i18n="learnEnglish"></button>
          </div>
        </div>
        <div class="filter">
          <span class="filter-label" data-i18n="filterAudience"></span>
          <div class="segmented" data-filter="audience">
            <button type="button" data-value="" data-i18n="all"></button>
            <button type="button" data-value="adults" data-i18n="adults"></button>
            <button type="button" data-value="kids" data-i18n="kids"></button>
          </div>
        </div>
      </div>

      <!-- Loading / empty / error messages go here -->
      <div id="status" class="status" aria-live="polite"></div>

      <!-- Class cards are built in app.js -->
      <ul id="session-list" class="session-list"></ul>
    </section>
    <!-- Private classes: free times computed by GET /private-slots (built in app.js). -->
    <section class="private">
      <div class="catalog-head">
        <h2 data-i18n="privateTitle"></h2>
        <p class="tz-note" data-i18n="privateIntro"></p>
      </div>
      <div class="filters">
        <div class="filter">
          <span class="filter-label" data-i18n="filterLanguage"></span>
          <div class="segmented" data-private="language">
            <button type="button" data-value="es" data-i18n="learnSpanish"></button>
            <button type="button" data-value="en" data-i18n="learnEnglish"></button>
          </div>
        </div>
        <div class="filter">
          <span class="filter-label" data-i18n="lengthLabel"></span>
          <div class="segmented" data-private="minutes">
            <button type="button" data-value="30">30 min</button>
            <button type="button" data-value="45">45 min</button>
            <button type="button" data-value="60">60 min</button>
          </div>
        </div>
      </div>
      <p class="muted small break-note" hidden></p>
      <div id="private-status" class="status" aria-live="polite" hidden></div>
      <ul id="private-days" class="block-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <a class="link" href="policies.html" data-i18n="policiesLink"></a>
      <a class="link" href="mailto:hola@hablemos.live">hola@hablemos.live</a>
    </div>
  </footer>

  <!-- Sign-in dialog. <dialog> + showModal() gives a real modal for free:
       focus moves into it, the page behind is inert, and Esc closes it. -->
  <dialog id="signin-dialog" class="dialog" aria-labelledby="signin-title">
    <h2 id="signin-title" data-i18n="signinTitle"></h2>

    <form id="signin-form" novalidate>
      <p data-i18n="signinIntro"></p>
      <label class="field">
        <span data-i18n="emailLabel"></span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <p id="signin-error" class="form-error" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-action="close-signin" data-i18n="cancel"></button>
        <button type="submit" class="btn-primary" id="signin-submit"></button>
      </div>
    </form>

    <div id="signin-sent" hidden>
      <p id="signin-sent-text"></p>
      <p id="signin-sent-hint" class="muted"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-primary" data-action="close-signin" data-i18n="close"></button>
      </div>
    </div>
  </dialog>

  <!-- Book dialog. app.js fills in the class, builds one checkbox per learner when
       it opens, and updates the price and balance lines as boxes are ticked. -->
  <dialog id="book-dialog" class="dialog" aria-labelledby="book-title">
    <form id="book-form" novalidate>
      <h2 id="book-title"></h2>
      <p id="book-when" class="muted"></p>

      <fieldset class="attendees">
        <legend data-i18n="whoAttends"></legend>
        <div id="book-learners"></div>
        <p id="book-audience-note" class="muted small"></p>
        <!-- Private classes: how many seats (you + friends); app.js fills the options. -->
        <label class="field book-seats" id="book-seats-field" hidden><span data-i18n="seatsLabel"></span>
          <select name="seats" id="book-seats"></select></label>
        <p id="book-seats-hint" class="muted small"></p>
      </fieldset>

      <p id="book-price" class="book-price"></p>
      <p id="book-balance" class="muted"></p>
      <!-- Shown only when the credit is short: closes this dialog, opens Buy credit. -->
      <p id="book-buy" hidden>
        <button type="button" class="btn-secondary btn-small" data-action="open-buy" data-i18n="buyCredit"></button>
      </p>
      <p class="muted small break-note" hidden></p>
      <p id="book-error" class="form-error" aria-live="polite"></p>

      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-action="close-book" data-i18n="cancel"></button>
        <button type="submit" class="btn-primary" id="book-submit"></button>
      </div>
    </form>
  </dialog>

  <!-- Cancel dialog: which booking, and how much credit comes back (app.js fills it in). -->
  <dialog id="cancel-dialog" class="dialog" aria-labelledby="cancel-title">
    <form id="cancel-form" novalidate>
      <h2 id="cancel-title" data-i18n="cancelTitle"></h2>
      <p id="cancel-what"></p>
      <p id="cancel-refund" class="book-price"></p>
      <p id="cancel-error" class="form-error" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-action="close-cancel" data-i18n="keepBooking"></button>
        <button type="submit" class="btn-danger" id="cancel-submit"></button>
      </div>
    </form>
  </dialog>

  <!-- Buy credit dialog: one radio button per pack (GET /credit-packs, built in
       app.js). Continue sends you to Stripe's payment page; Stripe sends you back. -->
  <dialog id="buy-dialog" class="dialog" aria-labelledby="buy-title">
    <form id="buy-form" novalidate>
      <h2 id="buy-title" data-i18n="buyTitle"></h2>
      <p data-i18n="buyIntro"></p>
      <fieldset class="packs">
        <legend data-i18n="choosePack"></legend>
        <div id="buy-packs"></div>
      </fieldset>
      <p id="buy-status" class="muted" aria-live="polite"></p>
      <p class="muted small" data-i18n="buyNote"></p>
      <p id="buy-error" class="form-error" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-action="close-buy" data-i18n="cancel"></button>
        <button type="submit" class="btn-primary" id="buy-submit"></button>
      </div>
    </form>
  </dialog>

  <!-- My Account: your name, and the people on your account (app.js fills the list).
       The two forms own their inputs; app.js fills them only when the dialog opens
       or Edit is clicked. -->
  <dialog id="account-dialog" class="dialog" aria-labelledby="account-title">
    <h2 id="account-title" data-i18n="accountTitle"></h2>
    <form id="name-form" class="account-form" novalidate>
      <label class="field"><span data-i18n="yourName"></span>
        <input type="text" name="display_name" maxlength="60" required></label>
      <button type="submit" class="btn-secondary btn-small" data-i18n="saveName"></button>
    </form>

    <h3 data-i18n="peopleTitle"></h3>
    <p class="muted small" data-i18n="peopleHint"></p>
    <ul id="people-list" class="people-list"></ul>

    <form id="person-form" class="account-form person-form" novalidate>
      <h3 id="person-form-title"></h3>
      <label class="field"><span data-i18n="personName"></span>
        <input type="text" name="display_name" maxlength="60" required></label>
      <div class="add-block-fields">
        <label class="field"><span data-i18n="personLanguage"></span>
          <select name="native_language">
            <option value="en" data-i18n="speaksEnglish"></option>
            <option value="es" data-i18n="speaksSpanish"></option>
          </select></label>
        <label class="attendee"><input type="checkbox" name="is_minor"> <span data-i18n="under18"></span></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="person-cancel-edit" data-action="cancel-edit-person" data-i18n="cancel" hidden></button>
        <button type="submit" class="btn-primary" id="person-submit"></button>
      </div>
    </form>

    <p id="account-error" class="form-error" aria-live="polite"></p>
    <div class="dialog-actions">
      <button type="button" class="btn-secondary" data-action="close-account" data-i18n="close"></button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
