# Test every push and pull request; deploy pushes to main to staging, then
# (after a person approves) the same image to production.
#
#   test:           go vet + go test against a real Postgres (a throwaway container)
#   build:          build the image once, push it to Artifact Registry
#   deploy-staging: migrate-staging job (migrations + seed data), hablemos-staging
#                   service, check https://dev.hablemos.live
#   deploy-prod:    waits for approval on the "production" environment (repository
#                   Settings > Environments), then the same image: migrate job,
#                   hablemos-api service, check https://hablemos.live
#
# Google sign-in uses Workload Identity Federation (infra/github.tf): no key is
# stored in GitHub. Google only trusts runs of this repository on main.
#
# Third-party actions are pinned to a full commit SHA (the comment says which
# release), so a moved or hijacked tag can't change what runs here.

name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # a "Run workflow" button on the Actions tab

# Workflows get no permissions unless granted. Jobs below ask for what they need.
permissions:
  contents: read

env:
  REGION: us-east1
  IMAGE_REPO: us-east1-docker.pkg.dev/hablemos-live/app/api

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      # A real Postgres 16 for the tests, like the Codespace's db container.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Apply migrations (with our own runner, as prod does)
        run: go run ./cmd/api migrate
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for its signed identity token
    outputs:
      image: ${{ steps.image.outputs.image }} # handed to both deploy jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to Google (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/529979780991/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@hablemos-live.iam.gserviceaccount.com

      - name: Image name (tag = short commit hash)
        id: image
        run: echo "image=$IMAGE_REPO:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy-staging:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://dev.hablemos.live
    permissions:
      contents: read
      id-token: write
    # One deploy per environment at a time; a newer push waits its turn.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Sign in to Google (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/529979780991/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@hablemos-live.iam.gserviceaccount.com

      # Migrations first, so the new code never runs against an old schema. On
      # staging the job also reloads the seed data, moving its classes to future dates.
      - name: Migrate (and seed) the staging database
        run: |
          gcloud run jobs update migrate-staging --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute migrate-staging --region "$REGION" --wait

      - name: Deploy the staging service
        run: gcloud run services update hablemos-staging --image "$IMAGE" --region "$REGION" --quiet

      - name: Check the staging site
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://dev.hablemos.live/health
          echo
          curl -fsS https://dev.hablemos.live/env | grep -q '"env":"staging"'

  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-24.04
    # The "production" environment requires a reviewer: the run pauses here
    # until someone clicks "Review deployments" > Approve on the Actions page.
    environment:
      name: production
      url: https://hablemos.live
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }} # the exact image staging just ran
    steps:
      - name: Sign in to Google (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/529979780991/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@hablemos-live.iam.gserviceaccount.com

      # If this fails, the deploy stops and the current version keeps serving.
      - name: Migrate the production database
        run: |
          gcloud run jobs update migrate --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute migrate --region "$REGION" --wait

      - name: Deploy the production service
        run: gcloud run services update hablemos-api --image "$IMAGE" --region "$REGION" --quiet

      - name: Check the live site
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://hablemos.live/health
          echo
